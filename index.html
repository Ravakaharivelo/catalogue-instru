<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Catalogue Instru-Karaoke-Mg </title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 20px;
  color: #222;
}
main {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 12px;
}
h1 { text-align: center; color: #172554; }
input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  margin: 15px 0;
}
#liste {
  white-space: pre-wrap;
  line-height: 1.8;
}
</style>
</head>
<body>
<main>
<h1>R.PROD KARAOKE</h1>
<p>Catalogue des chansons</p>
<input id="search" placeholder="Rechercher une chanson...">
<div id="liste"></div>
</main>

<script>
const chansons = `
APETRAHO ETO NY LISTE TXT-NAO

1. Andriananahary masina indrindra (FFPM 1)
2. Misaora an'i Zanahary (FFPM 2)
3. Isaorana anie Andriamanitsika (FFPM 3)
4. Mamy ny fitianao (FFPM 4)
5. Jehovah, Ray an-danitra (FFPM 5)
6. Avia, miondreha (FFPM 6)
7. Misaora an'Andriamanitra (FFPM 7)
8. Dera, laza, hery, haja (FFPM 8) - RTM
9. Ry Tompo Zanaharinay (FFPM 9)
10. Ry Tomponay Tsitoha ô (FFPM 10)
11. Endrey ny voninahitrao (FFPM 11)
12. Jehovah ô, derainay Hianao (FFPM 12)
13. Misaora ny Mpahary (FFPM 13)
14. O ry tany rehetra, avia izao (FFPM 14)
15. Avia hankalaza (FFPM 15)
16. Avia, ry vazantany ô (FFPM 16) - Version 2
17. Haja sy voninahitra (FFPM 17)
18. Ny feonay rehetra izao (FFPM 18)
19. Misaotra Anao zahay izao (FFPM 19)
20. Tsaroanay tokoa izao (FFPM 20)
21. Derao Andriamanitra (FFPM 21)
22. Ry Rainay Izay namorona (FFPM 22)
23. Tsy misy zava-mahasoa (FFPM 23)
`;

const liste = document.getElementById('liste');
const recherche = document.getElementById('search');

function afficher() {
  const q = recherche.value.toLowerCase();
  liste.innerHTML = '';

  chansons.split('\n')
    .filter(x => x.toLowerCase().includes(q))
    .forEach(x => {
      if (!x.trim()) return;
      const p = document.createElement('p');
      p.textContent = x;
      liste.appendChild(p);
    });
}

recherche.addEventListener('input', afficher);
afficher();
</script>
</body>
</html>
