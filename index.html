
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101d3a">

<title>Catalogue Instru-Karaoke-Mg</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  margin: 0;
  color: #1e293b;
}

header {
  background: linear-gradient(135deg, #101d3a, #243f72);
  color: white;
  padding: 35px 20px;
  text-align: center;
}

header h1 {
  font-size: 25px;
  margin: 0 0 10px;
  letter-spacing: 1px;
}

header p {
  margin: 0;
  color: #cbd5e1;
  font-size: 14px;
}

main {
  max-width: 750px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px rgba(0,0,0,.06);
}

.section-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 5px;
}

.subtitle {
  color: #64748b;
  font-size: 13px;
  margin-top: 5px;
}

.search-box {
  position: relative;
  margin: 22px 0 15px;
}

.search-box input {
  width: 100%;
  padding: 16px 18px 16px 45px;
  border: 1px solid #dbe2ea;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #f8fafc;
}

.search-box input:focus {
  border-color: #2563eb;
  background: white;
  box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 15px;
  font-size: 18px;
}

.counter {
  background: #eff6ff;
  color: #1d4ed8;
  padding: 12px 15px;
  border-radius: 9px;
  font-size: 14px;
  margin-bottom: 15px;
}

#liste {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chanson {
  padding: 13px 15px;
  border: 1px solid #edf0f5;
  border-radius: 9px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: .2s;
}

.chanson:hover {
  background: #f0f6ff;
  border-color: #bfdbfe;
  transform: translateX(3px);
}

.numero {
  color: #2563eb;
  font-weight: bold;
  min-width: 25px;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 30px 10px;
}

footer {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  padding: 15px 10px 30px;
}

@media(max-width: 600px) {
  header {
    padding: 28px 15px;
  }

  header h1 {
    font-size: 20px;
  }

  main {
    margin: 15px 10px;
    padding: 17px;
  }

  .chanson {
    font-size: 13px;
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 INSTRU KARAOKE MG</h1>
  <p>Catalogue des chansons évangéliques</p>
</header>

<main>

  <div class="section-title">📚 Notre catalogue</div>
  <p class="subtitle">
    Retrouvez facilement vos chansons préférées.
  </p>

  <div class="search-box">
    <span class="search-icon">🔎</span>
    <input
      id="search"
      type="search"
      placeholder="Rechercher une chanson ou un artiste..."
      autocomplete="off"
    >
  </div>

  <div class="counter" id="counter"></div>

  <div id="liste"></div>

</main>

<footer>
  © Instru-Karaoke-Mg | Catalogue musical
</footer>

<script>

const chansons = `
Adidiko ianao (Barry's)
AFA - Faniriako
AFAKA - AFAFI
AFOIKO HO ANAO NY AIKO (RIJA RAKOTO) - (SANS PAROLE)
Afonny fanahy (Dayvide)
Agnao tokoa Jesoa ro zoky (Vetson'i Fianara) - -p
AIA NAREO (FFA) - KTLM - (SANS PAROLE)
AJC & JAO & MILY CLEMENT Zanaka adala
AKON'NY LANITRA - Ekeko re
`;

const liste = document.getElementById('liste');
const recherche = document.getElementById('search');
const counter = document.getElementById('counter');

const toutesLesChansons = chansons
  .split('\n')
  .map(x => x.trim())
  .filter(x => x.length > 0);

function normaliser(texte) {
  return texte
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function afficher() {

  const q = normaliser(recherche.value.trim());

  const resultats = toutesLesChansons.filter(x =>
    normaliser(x).includes(q)
  );

  liste.innerHTML = '';

  counter.textContent =
    `${resultats.length} chanson(s) trouvée(s) / ${toutesLesChansons.length} au total`;

  if (resultats.length === 0) {
    liste.innerHTML =
      '<div class="empty">Aucune chanson trouvée 😕</div>';
    return;
  }

  resultats.forEach((chanson, index) => {

    const div = document.createElement('div');
    div.className = 'chanson';

    const numero = document.createElement('span');
    numero.className = 'numero';
    numero.textContent = String(index + 1).padStart(2, '0');

    const nom = document.createElement('span');
    nom.textContent = chanson;

    div.appendChild(numero);
    div.appendChild(nom);

    liste.appendChild(div);

  });

}

recherche.addEventListener('input', afficher);

afficher();

</script>

</body>
</html>
