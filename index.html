
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142344">

<title>Catalogue Instru-Karaoke-Mg</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #1e293b;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #101d3a, #294d83);
  color: white;
  padding: 38px 20px;
  text-align: center;
}

header h1 {
  font-size: 25px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

header p {
  color: #cbd5e1;
  font-size: 14px;
}

/* MAIN */
main {
  max-width: 850px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px rgba(0,0,0,.05);
}

.section-title {
  font-size: 20px;
  font-weight: bold;
}

.subtitle {
  color: #64748b;
  font-size: 13px;
  margin-top: 8px;
  line-height: 1.5;
}

/* SEARCH */
.search-box {
  position: relative;
  margin: 22px 0 15px;
}

.search-box input {
  width: 100%;
  padding: 16px 45px;
  border: 1px solid #dbe2ea;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #f8fafc;
}

.search-box input:focus {
  border-color: #2563eb;
  background: white;
  box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 15px;
  font-size: 18px;
}

/* CATEGORIES */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}

.filter-btn {
  border: 1px solid #dbe2ea;
  background: white;
  color: #475569;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.filter-btn:hover,
.filter-btn.active {
  background: #1d4ed8;
  color: white;
  border-color: #1d4ed8;
}

/* TOOLS */
.tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.counter {
  color: #1d4ed8;
  background: #eff6ff;
  padding: 11px 14px;
  border-radius: 9px;
  font-size: 13px;
}

.sort-btn {
  padding: 10px 13px;
  border: 1px solid #dbe2ea;
  background: white;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  color: #334155;
}

/* LISTE */
#liste {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chanson {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  border: 1px solid #edf0f5;
  border-radius: 10px;
  background: white;
  transition: .2s;
}

.chanson:hover {
  background: #f0f6ff;
  border-color: #bfdbfe;
}

.music-icon {
  width: 34px;
  height: 34px;
  min-width: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eff6ff;
  color: #2563eb;
  border-radius: 9px;
  font-size: 19px;
}

.song-info {
  flex: 1;
  min-width: 0;
}

.song-name {
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.song-category {
  display: inline-block;
  margin-top: 5px;
  font-size: 11px;
  color: #64748b;
  background: #f1f5f9;
  padding: 4px 8px;
  border-radius: 20px;
}

.copy-btn {
  border: none;
  background: #f1f5f9;
  color: #475569;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  flex-shrink: 0;
}

.copy-btn:hover {
  background: #dbeafe;
  color: #1d4ed8;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 35px 10px;
  font-size: 14px;
}

/* TOP BUTTON */
#topBtn {
  position: fixed;
  bottom: 22px;
  right: 20px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #1d4ed8;
  color: white;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  display: none;
  z-index: 10;
}

#topBtn:hover {
  background: #142f70;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  color: #94a3b8;
  font-size: 12px;
}

/* MOBILE */
@media(max-width: 600px) {

  header {
    padding: 30px 15px;
  }

  header h1 {
    font-size: 20px;
  }

  main {
    margin: 14px 10px;
    padding: 17px;
  }

  .tools {
    align-items: stretch;
  }

  .counter,
  .sort-btn {
    text-align: center;
  }

  .song-name {
    font-size: 13px;
  }

  .copy-btn {
    padding: 8px;
  }

}
</style>
</head>

<body>

<header>
  <h1>🎵 INSTRU KARAOKE MG</h1>
  <p>Catalogue des chansons évangéliques</p>
</header>

<main>

  <div class="section-title">📚 Notre catalogue</div>

  <p class="subtitle">
    Retrouvez facilement vos chansons préférées.
    Recherchez par titre ou nom d'artiste.
  </p>

  <!-- RECHERCHE -->
  <div class="search-box">
    <span class="search-icon">🔎</span>

    <input
      id="search"
      type="search"
      placeholder="Rechercher une chanson..."
      autocomplete="off"
    >
  </div>

  <!-- FILTRES AUTOMATIQUES -->
  <div class="filters" id="filters"></div>

  <!-- COMPTEUR ET TRI -->
  <div class="tools">

    <div class="counter" id="counter"></div>

    <button class="sort-btn" id="sortBtn">
      ↕ Tri : A – Z
    </button>

  </div>

  <!-- LISTE DES CHANSONS -->
  <div id="liste"></div>

</main>

<footer>
  © Instru-Karaoke-Mg | Catalogue musical
</footer>

<button id="topBtn" title="Retour en haut">
  ↑
</button>

<script>

// ======================================
// 1. DONNEES DES CHANSONS
// ======================================

// Sokajy azo ampiasaina:
// FFPM
// Fifohazana
// Fihirana Fanampiny
// Katolika
// Variétés Évangéliques

const chansons = [
{
    nom: "1. Andriananahary masina indrindra (FFPM 1)",
    categorie: "FFPM"
  },

  {
    nom: "2. Misaora an'i Zanahary (FFPM 2)",
    categorie: "FFPM"
  },

  {
    nom: "3. Isaorana anie Andriamanitsika (FFPM 3)",
    categorie: "FFPM"
  },

  {
    nom: "4. Mamy ny fitianao (FFPM 4)",
    categorie: "FFPM"
  },

  {
    nom: "5. Jehovah, Ray an-danitra (FFPM 5)",
    categorie: "FFPM"
  },
  {
    nom: "Adidiko ianao (Barry's)",
    categorie: "Variétés Évangéliques"
  },

    {
    nom: "295. Miorena mafy tsara (FFPM 295 - Version Fifohazana)",
    categorie: "Fifohazana"
  },

  {
    nom: "Aina no fetra ry Tompo Mpanjaka (Fifohazana)",
    categorie: "Fifohazana"
  },

  {
    nom: "Aiza no misy Anao ry Jeso (FIFOHAZANA)",
    categorie: "Fifohazana"
  },

  {
    nom: "Aiza no misy Anao ry Jeso (FIFOHAZANA) - Version 2",
    categorie: "Fifohazana"
  },

  {
    nom: "Asandrato avo re ny hiranao (FIFOHAZANA) - Version 2",
    categorie: "Fifohazana"
  },

   {
    nom: "1. Hira faneva 30-taona FJKM (FIHIRANA FANAMPINY 1)",
    categorie: "Fihirana Fanampiny"
  },

  {
    nom: "2. He, manolo-tena (Fihirana fanampiny 2)",
    categorie: "Fihirana Fanampiny"
  },

  {
    nom: "3. FF3.Jeso Vato fehizoro - Fihirana Fanampiny",
    categorie: "Fihirana Fanampiny"
  },

  {
    nom: "4. Ry Fanahy ô (Fihirana fanampiny 4)",
    categorie: "Fihirana Fanampiny"
  },

  {
    nom: "5. Izaho no fananganana ny maty (Fihirana fanampiny 5)",
    categorie: "Fihirana Fanampiny"
  }

];

// ======================================
// 2. INITIALISATION
// ======================================

const liste = document.getElementById('liste');
const recherche = document.getElementById('search');
const counter = document.getElementById('counter');
const sortBtn = document.getElementById('sortBtn');
const topBtn = document.getElementById('topBtn');
const filters = document.getElementById('filters');

let categorieActive = 'Toutes';
let ordreAZ = true;

// ======================================
// 3. NORMALISATION
// ======================================

function normaliser(texte) {

  return texte
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();

}

// ======================================
// 4. CREATION AUTOMATIQUE DES CATEGORIES
// ======================================

const categoriesDisponibles = [
  'FFPM',
  'Fifohazana',
  'Fihirana Fanampiny',
  'Katolika',
  'Variétés Évangéliques'
];

// Bouton Toutes
const btnToutes = document.createElement('button');

btnToutes.className = 'filter-btn active';
btnToutes.textContent = 'Toutes';

btnToutes.addEventListener('click', () => {

  categorieActive = 'Toutes';

  document.querySelectorAll('.filter-btn')
    .forEach(b => b.classList.remove('active'));

  btnToutes.classList.add('active');

  afficher();

});

filters.appendChild(btnToutes);

// Création des boutons catégories
categoriesDisponibles.forEach(categorie => {

  const btn = document.createElement('button');

  btn.className = 'filter-btn';
  btn.textContent = categorie;

  btn.addEventListener('click', () => {

    categorieActive = categorie;

    document.querySelectorAll('.filter-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    afficher();

  });

  filters.appendChild(btn);

});

// ======================================
// 5. AFFICHAGE DES CHANSONS
// ======================================

function afficher() {

  const q = normaliser(recherche.value.trim());

  let resultats = chansons.filter(chanson => {

    const rechercheOK =
      normaliser(chanson.nom).includes(q);

    const categorieOK =
      categorieActive === 'Toutes' ||
      chanson.categorie === categorieActive;

    return rechercheOK && categorieOK;

  });

  // TRI ALPHABETIQUE
  resultats.sort((a, b) =>
    a.nom.localeCompare(b.nom, 'fr', {
      sensitivity: 'base'
    })
  );

  if (!ordreAZ) {
    resultats.reverse();
  }

  liste.innerHTML = '';

  counter.textContent =
    `${resultats.length} chanson(s) trouvée(s) / ${chansons.length} au total`;

  if (resultats.length === 0) {

    const vide = document.createElement('div');

    vide.className = 'empty';
    vide.textContent = '🎵 Aucune chanson trouvée.';

    liste.appendChild(vide);

    return;

  }

  resultats.forEach(chanson => {

    const div = document.createElement('div');
    div.className = 'chanson';

    // ICON MUSIQUE
    const icon = document.createElement('span');

    icon.className = 'music-icon';
    icon.textContent = '♫';

    // INFORMATIONS
    const info = document.createElement('div');

    info.className = 'song-info';

    const nom = document.createElement('div');

    nom.className = 'song-name';
    nom.textContent = chanson.nom;

    const categorie = document.createElement('span');

    categorie.className = 'song-category';
    categorie.textContent = chanson.categorie;

    info.appendChild(nom);
    info.appendChild(categorie);

    // COPIER
    const copy = document.createElement('button');

    copy.className = 'copy-btn';
    copy.textContent = 'Copier';

    copy.addEventListener('click', async () => {

      try {

        await navigator.clipboard.writeText(chanson.nom);

        copy.textContent = '✓ Copié';

        setTimeout(() => {
          copy.textContent = 'Copier';
        }, 1500);

      } catch (error) {

        copy.textContent = 'Erreur';

      }

    });

    div.appendChild(icon);
    div.appendChild(info);
    div.appendChild(copy);

    liste.appendChild(div);

  });

}

// ======================================
// 6. RECHERCHE INSTANTANEE
// ======================================

recherche.addEventListener('input', afficher);

// ======================================
// 7. TRI A-Z / Z-A
// ======================================

sortBtn.addEventListener('click', () => {

  ordreAZ = !ordreAZ;

  sortBtn.textContent = ordreAZ
    ? '↕ Tri : A – Z'
    : '↕ Tri : Z – A';

  afficher();

});

// ======================================
// 8. RETOUR EN HAUT
// ======================================

window.addEventListener('scroll', () => {

  topBtn.style.display =
    window.scrollY > 300 ? 'block' : 'none';

});

topBtn.addEventListener('click', () => {

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

});

// ======================================
// 9. LANCEMENT
// ======================================

afficher();

</script>

</body>
</html>
