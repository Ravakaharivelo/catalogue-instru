
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142344">

<title>Catalogue Instru-Karaoke-Mg</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #1e293b;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #101d3a, #294d83);
  color: white;
  padding: 38px 20px;
  text-align: center;
}

header h1 {
  font-size: 25px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

header p {
  color: #cbd5e1;
  font-size: 14px;
}

/* MAIN */
main {
  max-width: 850px;
  margin: 25px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px rgba(0,0,0,.05);
}

.section-title {
  font-size: 20px;
  font-weight: bold;
}

.subtitle {
  color: #64748b;
  font-size: 13px;
  margin-top: 8px;
  line-height: 1.5;
}

/* SEARCH */
.search-box {
  position: relative;
  margin: 22px 0 15px;
}

.search-box input {
  width: 100%;
  padding: 16px 45px;
  border: 1px solid #dbe2ea;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: #f8fafc;
}

.search-box input:focus {
  border-color: #2563eb;
  background: white;
  box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 15px;
  font-size: 18px;
}

/* FILTERS */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}

.filter-btn {
  border: 1px solid #dbe2ea;
  background: white;
  color: #475569;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.filter-btn:hover,
.filter-btn.active {
  background: #1d4ed8;
  color: white;
  border-color: #1d4ed8;
}

/* TOOLS */
.tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.counter {
  color: #1d4ed8;
  background: #eff6ff;
  padding: 11px 14px;
  border-radius: 9px;
  font-size: 13px;
}

.sort-btn {
  padding: 10px 13px;
  border: 1px solid #dbe2ea;
  background: white;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  color: #334155;
}

/* SONG LIST */
#liste {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chanson {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  border: 1px solid #edf0f5;
  border-radius: 10px;
  transition: .2s;
  background: white;
}

.chanson:hover {
  background: #f0f6ff;
  border-color: #bfdbfe;
}

.music-icon {
  width: 34px;
  height: 34px;
  min-width: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eff6ff;
  color: #2563eb;
  border-radius: 9px;
  font-size: 17px;
}

.song-name {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.copy-btn {
  border: none;
  background: #f1f5f9;
  color: #475569;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
}

.copy-btn:hover {
  background: #dbeafe;
  color: #1d4ed8;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 35px 10px;
  font-size: 14px;
}

/* BACK TO TOP */
#topBtn {
  position: fixed;
  bottom: 22px;
  right: 20px;
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #1d4ed8;
  color: white;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  display: none;
  z-index: 10;
}

#topBtn:hover {
  background: #142f70;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  color: #94a3b8;
  font-size: 12px;
}

/* MOBILE */
@media(max-width: 600px) {

  header {
    padding: 30px 15px;
  }

  header h1 {
    font-size: 20px;
  }

  main {
    margin: 14px 10px;
    padding: 17px;
  }

  .tools {
    align-items: stretch;
  }

  .counter,
  .sort-btn {
    text-align: center;
  }

  .song-name {
    font-size: 13px;
  }

  .copy-btn {
    padding: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎵 INSTRU KARAOKE MG</h1>
  <p>Catalogue des chansons évangéliques</p>
</header>

<main>

  <div class="section-title">📚 Notre catalogue</div>

  <p class="subtitle">
    Retrouvez facilement vos chansons préférées.
    Recherchez par titre ou nom d'artiste.
  </p>

  <!-- RECHERCHE -->
  <div class="search-box">
    <span class="search-icon">🔎</span>

    <input
      id="search"
      type="search"
      placeholder="Rechercher une chanson..."
      autocomplete="off"
    >
  </div>

  <!-- CATEGORIES -->
  <div class="filters" id="filters">

    <button class="filter-btn active" data-category="Toutes">
      Toutes
    </button>

    <button class="filter-btn" data-category="FFPM">
      FFPM
    </button>

    <button class="filter-btn" data-category="Fifohazana">
      Fifohazana
    </button>

    <button class="filter-btn" data-category="Fihirana Fanampiny">
      Fihirana Fanampiny
    </button>

    <button class="filter-btn" data-category="Katolika">
      Katolika
    </button>

  </div>

  <!-- COMPTEUR ET TRI -->
  <div class="tools">

    <div class="counter" id="counter"></div>

    <button class="sort-btn" id="sortBtn">
      ↕ Tri : A – Z
    </button>

  </div>

  <!-- LISTE -->
  <div id="liste"></div>

</main>

<footer>
  © Instru-Karaoke-Mg | Catalogue musical
</footer>

<button id="topBtn" title="Retour en haut">
  ↑
</button>

<script>

// ===================================
// LISTE DES CHANSONS
// ===================================

const chansons = `

Adidiko ianao (Barry's)
AFA - Faniriako
AFAKA - AFAFI
AFOIKO HO ANAO NY AIKO (RIJA RAKOTO) - (SANS PAROLE)
Afonny fanahy (Dayvide)
Agnao tokoa Jesoa ro zoky (Vetson'i Fianara) - -p
AIA NAREO (FFA) - KTLM - (SANS PAROLE)
AJC & JAO & MILY CLEMENT Zanaka adala
AKON'NY LANITRA - Ekeko re

`;

// ===================================
// CONFIGURATION DES CATEGORIES
// ===================================

// Ampidiro eto ny catégorie an'ny hira tsirairay.
// Ohatra:
// "Adidiko ianao (Barry's)": "FFPM"

const categories = {

};

// ===================================
// INITIALISATION
// ===================================

const liste = document.getElementById('liste');
const recherche = document.getElementById('search');
const counter = document.getElementById('counter');
const sortBtn = document.getElementById('sortBtn');
const topBtn = document.getElementById('topBtn');

const toutesLesChansons = chansons
  .split('\n')
  .map(x => x.trim())
  .filter(x => x.length > 0);

let categorieActive = 'Toutes';
let ordreAZ = true;

// ===================================
// NORMALISATION
// Recherche sans accent
// ===================================

function normaliser(texte) {
  return texte
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

// ===================================
// AFFICHAGE
// ===================================

function afficher() {

  const q = normaliser(recherche.value.trim());

  let resultats = toutesLesChansons.filter(chanson => {

    const rechercheOK =
      normaliser(chanson).includes(q);

    const categorieChanson =
      categories[chanson] || 'Non classée';

    const categorieOK =
      categorieActive === 'Toutes' ||
      categorieChanson === categorieActive;

    return rechercheOK && categorieOK;

  });

  // TRI ALPHABETIQUE
  resultats.sort((a, b) =>
    a.localeCompare(b, 'fr', { sensitivity: 'base' })
  );

  if (!ordreAZ) {
    resultats.reverse();
  }

  liste.innerHTML = '';

  counter.textContent =
    `${resultats.length} chanson(s) trouvée(s) / ${toutesLesChansons.length} au total`;

  if (resultats.length === 0) {

    liste.innerHTML =
      '<div class="empty">🎵 Aucune chanson trouvée.</div>';

    return;
  }

  resultats.forEach(chanson => {

    const div = document.createElement('div');
    div.className = 'chanson';

    const icon = document.createElement('span');
    icon.className = 'music-icon';
    icon.textContent = '♫';

    const nom = document.createElement('span');
    nom.className = 'song-name';
    nom.textContent = chanson;

    const copy = document.createElement('button');
    copy.className = 'copy-btn';
    copy.textContent = 'Copier';

    copy.addEventListener('click', async () => {

      try {
        await navigator.clipboard.writeText(chanson);
        copy.textContent = '✓ Copié';

        setTimeout(() => {
          copy.textContent = 'Copier';
        }, 1500);

      } catch (error) {
        copy.textContent = 'Erreur';
      }

    });

    div.appendChild(icon);
    div.appendChild(nom);
    div.appendChild(copy);

    liste.appendChild(div);

  });

}

// ===================================
// RECHERCHE INSTANTANEE
// ===================================

recherche.addEventListener('input', afficher);

// ===================================
// FILTRES PAR CATEGORIE
// ===================================

document.querySelectorAll('.filter-btn').forEach(btn => {

  btn.addEventListener('click', () => {

    document.querySelectorAll('.filter-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    categorieActive = btn.dataset.category;

    afficher();

  });

});

// ===================================
// TRI A-Z / Z-A
// ===================================

sortBtn.addEventListener('click', () => {

  ordreAZ = !ordreAZ;

  sortBtn.textContent = ordreAZ
    ? '↕ Tri : A – Z'
    : '↕ Tri : Z – A';

  afficher();

});

// ===================================
// RETOUR EN HAUT
// ===================================

window.addEventListener('scroll', () => {

  topBtn.style.display =
    window.scrollY > 300 ? 'block' : 'none';

});

topBtn.addEventListener('click', () => {

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

});

// ===================================
// LANCEMENT
// ===================================

afficher();

</script>

</body>
</html>
